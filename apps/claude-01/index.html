<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b0f" />
    <meta
      name="description"
      content="ÓRBITA — fone de ouvido premium com cancelamento de ruído adaptativo espacial."
    />
    <title>ÓRBITA — Cancelamento de ruído adaptativo espacial</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('orbita-theme');
          var theme =
            stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <div id="app"></div>
    <noscript>Este site precisa de JavaScript para a experiência completa.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
