          - region "A bateria dura mesmo 40 horas com ANC ligado?":
            - paragraph [ref=e406]: Sim — 40 h com ANC adaptativo ativo e 56 h no modo ambiente. A carga rápida USB-C entrega 8 horas de reprodução em 10 minutos, medida em laboratório com volume a 50%.
        - generic [ref=e407]:
          - heading [level=3] [ref=e408]:
            - button "Como o ANC adaptativo espacial difere do ANC comum?" [ref=e409] [cursor=pointer]
          - region "Como o ANC adaptativo espacial difere do ANC comum?":
            - paragraph [ref=e411]: O ANC comum aplica um filtro fixo. O ÓRBITA remapeia o campo acústico 500 vezes por segundo com seis microfones beamforming e ajusta fase e amplitude por frequência — inclusive quando você vira a cabeça ou troca de ambiente.
        - generic [ref=e412]:
