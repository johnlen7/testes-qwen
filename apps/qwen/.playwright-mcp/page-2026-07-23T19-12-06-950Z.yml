            - button "Posso testar e devolver se não gostar?" [ref=e419] [cursor=pointer]
          - region "Posso testar e devolver se não gostar?":
            - paragraph [ref=e421]: 30 dias de teste em casa, devolução sem perguntas e reembolso integral. A caixa vai com selo de retorno pré-pago — o único risco é você não querer devolver.
