            - button "Quais codecs Bluetooth são suportados?" [ref=e414] [cursor=pointer]
          - region "Quais codecs Bluetooth são suportados?":
            - paragraph [ref=e416]: LDAC, aptX Adaptive, AAC e SBC, com Bluetooth 5.4 e conexão simultânea em dois dispositivos. O modo de latência de 18 ms usa um codec proprietário ativado pelo app.
        - generic [ref=e417]:
