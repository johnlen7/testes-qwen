<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ÓRBITA — fone de ouvido premium com cancelamento de ruído adaptativo espacial. Silêncio em órbita."
    />
    <title>ÓRBITA — Silêncio em órbita</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('orbita-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&family=Unbounded:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="site-header"></header>

    <main>
      <section id="hero"></section>
      <section id="como-funciona"></section>
      <section id="configurador"></section>
      <section id="features"></section>
      <section id="depoimentos"></section>
      <section id="faq"></section>
      <section id="comprar"></section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
