server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Assets com hash no nome nunca mudam de conteúdo.
    # assets/ = Vite, _app/immutable/ = SvelteKit, _astro/ = Astro.
    location ~* ^/p/[^/]+/(assets|_app/immutable|_astro)/.+\.(js|css|woff2?|png|jpe?g|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cada projeto resolve dentro da própria pasta.
    #
    # O `=404` no fim não é decoração. Sem ele, o último argumento do try_files
    # vira um REDIRECIONAMENTO INTERNO em vez de uma checagem de arquivo: um
    # slug inexistente redireciona para /p/<slug>/index.html, que re-casa esta
    # mesma location, que redireciona de novo — ciclo, e o nginx devolve 500.
    # Com `=404` como último argumento, todos os anteriores passam a ser
    # checados como arquivo, sem redirecionamento nenhum.
    location ~ ^/p/([^/]+)/ {
        try_files $uri $uri/ /p/$1/index.html =404;
    }

    location = /p/ {
        return 302 /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
