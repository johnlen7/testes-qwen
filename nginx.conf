server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Assets com hash no nome nunca mudam de conteúdo.
    location ~* ^/p/[^/]+/(assets|_app/immutable)/.+\.(js|css|woff2?|png|jpe?g|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cada projeto resolve dentro da própria pasta.
    location ~ ^/p/([^/]+)/ {
        try_files $uri $uri/ /p/$1/index.html;
    }

    location = /p/ {
        return 302 /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
